[package]
name = "pinplay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A tiny always-on-top video player for local files and web URLs"
license = "MIT"
readme = "README.md"
keywords = ["video", "pip", "mpv", "youtube", "cli"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

